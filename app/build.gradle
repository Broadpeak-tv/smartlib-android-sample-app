plugins {
    id 'com.android.application'
}

apply from: '../config.gradle'

android {
    namespace = 'tv.broadpeak.smartlib.demo.android'
    compileSdk androidConfig.compileSdk

    defaultConfig {
        applicationId "tv.broadpeak.smartlib.demo.android"
        minSdk androidConfig.minSdk
        targetSdk androidConfig.targetSdk
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility androidConfig.javaVersion
        targetCompatibility androidConfig.javaVersion
    }
}

dependencies {
    // SmartLib dependency
    implementation "tv.broadpeak.smartlib:smartlib-media3:$SMARTLIB_VERSION"

    // ExoPlayer dependency
    implementation "androidx.media3:media3-exoplayer:$androidConfig.media3Version"
    implementation "androidx.media3:media3-ui:$androidConfig.media3Version"
    implementation "androidx.media3:media3-exoplayer-dash:$androidConfig.media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$androidConfig.media3Version"
    implementation "androidx.media3:media3-datasource-okhttp:$androidConfig.media3Version"


    implementation 'androidx.appcompat:appcompat:1.5.1'
    implementation 'com.google.android.material:material:1.7.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation "androidx.test.ext:junit:$ANDROIDX_TEST_EXT_JUNIT_VERSION"
    androidTestImplementation "androidx.test.espresso:espresso-core:$ANDROIDX_TEST_ESPRESSO_VERSION"
}